name: Publish to npm

# Trigger on version tags (v0.1.0, v1.2.3, etc.)
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for provenance publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun test

      # Publish the single unified package containing the CLI and all templates using Trusted Publisher OIDC
      - name: Publish @pratikpsl/agent-skills
        run: npm publish --provenance --access public

      # Tag published versions in git for traceability.
      - name: Log published version
        run: |
          echo "Published tag: ${{ github.ref_name }}"
          echo "Package version: $(bun -e "console.log(require('./package.json').version)")"

